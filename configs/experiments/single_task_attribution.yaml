llm:
  base_url: http://127.0.0.1:8000/v1
  model: Qwen3.8-27B
  api_key: EMPTY
  timeout: 240
  max_retries: 2

harness:
  answer_system_prompt: >-
    你是严谨的知识问答助手。仅依据提供的证据回答；证据不足时明确说明不确定；不要编造引用。
  top_k_retrieval: 8
  top_k_ranked: 5
  context_max_chars: 9000

task:
  id: mitochondria-example
  question: 线粒体如何为细胞提供能量？
  expected_answer: 线粒体通过细胞呼吸产生 ATP，为细胞活动提供能量。
  documents:
    - id: bio-01
      title: 线粒体与能量代谢
      text: 线粒体是真核细胞的重要细胞器，主要通过氧化磷酸化等细胞呼吸过程产生三磷酸腺苷（ATP），为细胞活动提供能量。
    - id: bio-02
      title: 细胞核
      text: 细胞核储存遗传物质，并参与基因表达调控。

# 每个候选只改一个模块。此处给出格式示例；按研究假设编辑候选。
candidates:
  - id: answer-concise
    modules:
      EvidenceReasoning:
        answer_prompt: >-
          仅依据证据直接回答问题。优先用一句话给出核心结论，再补充必要限定；证据不足时明确说明。
  - id: retrieval-wider
    modules:
      EvidenceRetrieval:
        top_k_retrieval: 12
        top_k_ranked: 7
  - id: context-longer
    modules:
      EvidencePreparation:
        max_chars: 12000
