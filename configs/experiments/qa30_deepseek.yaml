# 30 题多题归因实验：train 上诊断与生成，dev 选择；test 通过 evaluate-test 最终评测。
llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  disable_thinking: true
  timeout: 240
  max_retries: 2

harness:
  answer_system_prompt: >-
    你是严谨的知识问答助手。仅依据提供的证据回答；证据不足时明确说明不确定；不要编造引用。
  top_k_retrieval: 8
  top_k_ranked: 5
  context_max_chars: 9000

# 题库与实验配置分开维护；runner 支持 tasks_file 指向题库。
benchmark: qa_token_f1
tasks_file: configs/tasks/qa30.yaml
candidates:
# 变体 A：只删 [文档 id]，保留标题
  - id: evidence-preparation-strip-id
    target_module: EvidencePreparation
    source_file: ../candidates/evidence_preparation_strip_id_keep_title.py

  - id: evidence-preparation-strip-metadata
    target_module: EvidencePreparation
    source_file: ../candidates/evidence_preparation_strip_metadata.py

priors:
  enabled: true
  file: ../priors/rag_operators.yaml

gate:
  minimum_dev_gain: 0.01
  minimum_pair_coverage: 0.90
  require_positive_ci_lower_bound: true
