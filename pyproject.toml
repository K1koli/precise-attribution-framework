[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precise-attribution-framework"
version = "0.2.0"
description = "用于受控干预与精确归因研究的独立合成实验框架"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
paf = "precise_attribution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
